[package]
name = "erp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mercure"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
calamine = "0.38.0"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
flate2 = "1.1.11"
hex = "0.4.3"
mime_guess = "2.0.5"
png = "0.18.1"
rand = "0.8"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
thiserror = "2.0.21"
time = "0.3"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webbrowser = "1.2.7"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
